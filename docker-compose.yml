name: adelgaceya

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.local
  DJANGO_DEBUG: "False"
  DJANGO_ENVIRONMENT: compose
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-only-secret-change-me}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
  DATABASE_URL: postgres://adelgaceya:${POSTGRES_PASSWORD:-adelgaceya}@postgres:5432/adelgaceya
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  DEFAULT_FROM_EMAIL: Adelgaceya <no-reply@adelgaceya.local>
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  ENABLE_API_DOCS: "True"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:${WEB_PORT:-8000},http://localhost:3000}
  FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-tW8uBgbY93Ih64CaqRsEIDheNMVimjTE97KQKAyVAxA=}
  AWS_STORAGE_BUCKET_NAME: adelgaceya-media
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_S3_REGION_NAME: us-east-1
  AWS_S3_ADDRESSING_STYLE: path
  SENTRY_DSN: ""
  GUNICORN_BIND: 0.0.0.0:8000
  WEB_CONCURRENCY: "2"

x-app: &app
  build:
    context: .
  image: adelgaceya:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: ["gunicorn", "config.wsgi:application", "--config", "config/gunicorn.py"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    ports:
      # Host port is configurable: set WEB_PORT in .env if 8000 is taken.
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adelgaceya
      POSTGRES_USER: adelgaceya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adelgaceya}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adelgaceya -d adelgaceya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Official MinIO images are not available to every registry mirror; the
    # Bitnami legacy image is a drop-in local substitute. Pin the digest so
    # environments resolve the same image. See docs/open-items.md.
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: adelgaceya-media
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data:
  minio-data:
