name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: config.settings.test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/adelgaceya
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/1

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adelgaceya
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Migration drift
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests with coverage gate
        run: uv run pytest --cov=apps --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: OpenAPI validation
        run: uv run python manage.py spectacular --file openapi.yaml --validate --fail-on-warn

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.yaml

      - name: Django deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-long-random-secret-key-1234567890
          DJANGO_ALLOWED_HOSTS: api.adelgaceya.pe
          DATABASE_URL: postgres://user:pass@db.example.com:5432/adelgaceya
          REDIS_URL: redis://redis.example.com:6379/0
          CELERY_BROKER_URL: redis://redis.example.com:6379/1
          AWS_STORAGE_BUCKET_NAME: adelgaceya-private
          FIELD_ENCRYPTION_KEYS: tW8uBgbY93Ih64CaqRsEIDheNMVimjTE97KQKAyVAxA=
          CSRF_TRUSTED_ORIGINS: https://app.adelgaceya.pe
          EMAIL_BACKEND: anymail.backends.mailgun.EmailBackend
          CAPTCHA_VERIFIER: apps.core.captcha.TurnstileCaptchaVerifier
          CAPTCHA_SECRET_KEY: ci-captcha-secret
        run: uv run python manage.py check --deploy

      - name: pip-audit
        run: uv run pip-audit

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r apps config

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: adelgaceya:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
